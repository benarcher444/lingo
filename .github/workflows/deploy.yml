# Every push to main: check it, then deploy it to the server.
#
# The deploy job is skipped until the repository variable DEPLOY_ENABLED is set
# to "true" (Settings → Secrets and variables → Actions → Variables), so pushes
# before the server exists only run the checks. Setup: DEPLOY.md, step 9.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time. A newer push waits for the current one rather than racing it.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # The suites that need no running server or browser. The browser suites
      # run locally before a push (CLAUDE.md, Verification).
      - run: npm test
      - run: npm run test:accents
      - run: npm run test:ai

  deploy:
    needs: check
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pinned host key: refuse to connect to anything pretending to be the server.
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The server ties this key to one command (lingo-deploy), so none is sent.
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "root@$HOST"
